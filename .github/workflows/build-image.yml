name: Build image(s) on PR

on:
  pull_request:
    paths:
      - ci/images/**/Dockerfile.*
      - ci/images/common/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  filter:
    if: github.repository == 'cdxgen/cdxgen'
    runs-on: ubuntu-24.04
    outputs:
      imagefiles: ${{ steps.changed.outputs.files }}
    steps:
      - name: Get changed files
        id: changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.pull_request.base.sha,
              head: context.payload.pull_request.head.sha
            });

            const changed = (data.files)
              .filter(file => file.status !== 'removed')
              .map(file => file.filename);

            const files = new Set(changed.filter(f => /^ci\/images\/.*\/?Dockerfile.*$/.test(f)));

            // The shared scripts under ci/images/common/ are baked into every
            // image that sources them, so a change there builds one
            // representative per distro rather than the whole matrix. Between
            // them these cover every branch in mirrors.sh - apk, apt, yum,
            // npm, pip and rubygems - and both cdxgen-build.sh smoke-test and
            // --no-optional paths. The full matrix still runs on push.
            if (changed.some(f => f.startsWith('ci/images/common/'))) {
              [
                'ci/images/alpine/Dockerfile.golang1.27',
                'ci/images/alpine/Dockerfile.ruby3.4',
                'ci/images/debian/Dockerfile.golang1.27',
                'ci/images/debian/Dockerfile.ruby3.4',
                'ci/images/temurin/Dockerfile.java25'
              ].forEach(f => files.add(f));
            }

            core.setOutput("files", JSON.stringify([...files]));
  image:
    if: github.repository == 'cdxgen/cdxgen'
    needs: filter
    strategy:
      fail-fast: false
      matrix:
        imagefile: ${{ fromJson(needs.filter.outputs.imagefiles) }}
        platform: [ amd64, arm64 ]
        # Some images don't work on linux/arm64
        exclude:
          - imagefile: ci/images/Dockerfile.dotnet8
            platform: arm64
          - imagefile: ci/images/Dockerfile.dotnet9
            platform: arm64
          - imagefile: ci/images/Dockerfile.ruby2.5
            platform: arm64
          - imagefile: ci/images/debian/Dockerfile.ruby2.6
            platform: arm64
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup tool versions
        id: versions
        run: |
          cd .versions
          cat >> "$GITHUB_OUTPUT" << EOF
          docker-args<<VALUE
          $(awk 'FNR==2 {print "\""toupper(FILENAME)"="$1"\""}' *)
          VALUE
          EOF
      - name: Build image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: ${{ matrix.imagefile }}
          docker-args: |
            ${{ steps.versions.outputs.docker-args }}
          platforms: linux/${{ matrix.platform }}
          target: ${{ matrix.imagefile == 'ci/images/al10/Dockerfile.ruby-builder' && 'ruby-builder' || 'cdxgen' }}
